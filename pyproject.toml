[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerowidth"
version = "0.2.0"
description = "Detect, reveal and strip zero-width, bidi and other invisible characters, keeping emoji and words intact"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Unicode-3.0"
license-files = ["LICENSE", "LICENSE-UNICODE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "unicode",
    "zero-width",
    "invisible-characters",
    "default-ignorable",
    "bidi",
    "trojan-source",
    "sanitize",
    "homoglyph",
    "emoji",
    "steganography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.scripts]
zerowidth = "zerowidth._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/zerowidth"
Issues = "https://github.com/JaviLianes8/zerowidth/issues"
Changelog = "https://github.com/JaviLianes8/zerowidth/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# The Unicode data files are fetched locally and never shipped; only their manifest is.
include = [
    "src",
    "tests",
    "scripts/gen_ucd_tables.py",
    "scripts/fetch_upstream.py",
    "data/ucd/MANIFEST.json",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "README.md",
    "LICENSE",
    "LICENSE-UNICODE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zerowidth"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: builds the wheel and installs it into a fresh venv (needs network); run with -m e2e",
]
